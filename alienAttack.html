<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Alien Attack Platformer</title>
<style>
body{
    margin:0;
    overflow:hidden;
    background:#87CEEB;
    font-family:Arial,sans-serif;
    touch-action: none;
}

canvas{
    display:block;
    margin:auto;
    background:linear-gradient(#6ec6ff,#dff6ff);
    max-width: 100%;
    height: auto;
}

#hud{
    position:absolute;
    top:10px;
    left:10px;
    font-size:24px;
    font-weight:bold;
    z-index: 10;
}

#gameOver{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:white;
    display:none;

    background:#1c1c1c;
    padding:30px;
    border-radius:20px;
    border:2px solid #00ffff;

    box-shadow:
    0 0 20px cyan,
    0 0 40px rgba(0,255,255,.5);
    z-index: 20;
}

button{
    padding:12px 20px;
    margin:8px;
    font-size:16px;
    cursor:pointer;
}

/* Mobile On-Screen Controls */
#controls {
    position: absolute;
    bottom: 20px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    box-sizing: border-box;
    z-index: 10;
    user-select: none;
    -webkit-user-select: none;
}

.control-group {
    display: flex;
    gap: 10px;
}

.mob-btn {
    width: 65px;
    height: 65px;
    background: rgba(0, 0, 0, 0.4);
    border: 2px solid rgba(255, 255, 255, 0.6);
    color: white;
    font-size: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    outline: none;
    user-select: none;
    -webkit-user-select: none;
    backdrop-filter: blur(4px);
}

.mob-btn:active {
    background: rgba(0, 255, 255, 0.5);
    border-color: cyan;
}
</style>
</head>
<body>

<div id="hud">
    Score: <span id="score">0</span>
    |
    Lives: <span id="lives">3</span>
    |
    World: <span id="world">1-1</span>
</div>

<div id="gameOver">
    <h1 id="resultText">Game Over</h1>
    <h2 id="finalScore"></h2>

    <button onclick="location.reload()">Restart</button>
    <br>
    <br>
    <button onclick="window.location.href='index.html'">Back</button>
</div>

<canvas id="gameCanvas" width="1200" height="600"></canvas>

<!-- On-Screen Mobile Controls Layout -->
<div id="controls">
    <div class="control-group">
        <button class="mob-btn" id="leftBtn">&#8592;</button>
        <button class="mob-btn" id="rightBtn">&#8594;</button>
    </div>
    <div class="control-group">
        <button class="mob-btn" id="shootBtn">&#128165;</button>
        <button class="mob-btn" id="jumpBtn">&#8593;</button>
    </div>
</div>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let score = 0;
let lives = 3;
let gameRunning = true;
let currentLevel = 1;
const maxLevels = 10; // Extended progression for extended gameplay session (~10 mins)

const keys = {};

document.addEventListener("keydown",e=>{
    keys[e.key]=true;
});

document.addEventListener("keyup",e=>{
    keys[e.key]=false;
});

// Helper function to bind mobile touch/mouse events to key states
function bindTouchButton(id, keyCode) {
    const btn = document.getElementById(id);
    
    btn.addEventListener("touchstart", (e) => {
        e.preventDefault();
        keys[keyCode] = true;
    }, {passive: false});

    btn.addEventListener("touchend", (e) => {
        e.preventDefault();
        keys[keyCode] = false;
    }, {passive: false});

    btn.addEventListener("mousedown", () => {
        keys[keyCode] = true;
    });
    btn.addEventListener("mouseup", () => {
        keys[keyCode] = false;
    });
}

bindTouchButton("leftBtn", "ArrowLeft");
bindTouchButton("rightBtn", "ArrowRight");
bindTouchButton("jumpBtn", "ArrowUp");
bindTouchButton("shootBtn", " ");

const gravity = 0.8;

const player = {
    x:100,
    y:450,
    width:40,
    height:60,
    speed:5,
    velocityY:0,
    jumping:false,
    facing: 1
};

let platforms = [];
let aliens = [];
let coins = [];
let flag = {};
let levelLength = 2400;
let cameraX = 0;

// Procedural/Structured Level Generator for extended content
function loadLevel(lvl) {
    currentLevel = lvl;
    document.getElementById("world").textContent = `1-${lvl}`;
    player.x = 100;
    player.y = 450;
    player.velocityY = 0;
    bullets.length = 0;

    levelLength = 2000 + lvl * 400;
    platforms = [];
    aliens = [];
    coins = [];

    // Base ground blocks with gaps/pits as levels advance
    let currentX = 0;
    while(currentX < levelLength) {
        let pitWidth = (lvl > 3 && Math.random() < 0.3) ? 120 : 0;
        let groundWidth = 600 + Math.random() * 400;
        
        platforms.push({x: currentX, y: 550, width: groundWidth, height: 50});
        currentX += groundWidth + pitWidth;
    }

    // Floating platforms, enemies, and collectibles generator based on level difficulty
    let numPlatforms = 6 + lvl * 3;
    for (let i = 0; i < numPlatforms; i++) {
        let pX = 300 + i * (levelLength / (numPlatforms + 2)) + Math.random() * 100;
        let pY = 250 + Math.random() * 200;
        let pW = 140 + Math.random() * 80;

        platforms.push({x: pX, y: pY, width: pW, height: 20});

        // Add coin above platform
        if (Math.random() > 0.2) {
            coins.push({x: pX + pW / 2 - 10, y: pY - 40, collected: false});
        }

        // Add alien patrolling platform
        if (Math.random() > 0.3) {
            aliens.push({
                x: pX + 20,
                y: pY - 40,
                width: 40,
                height: 40,
                alive: true,
                dir: 1,
                minX: pX,
                maxX: pX + pW - 40
            });
        }
    }

    // Flag / Goal at the end of the level
    flag = {
        x: levelLength - 150,
        y: 450,
        width: 30,
        height: 100
    };
}

const bullets = [];

function shoot(){
    bullets.push({
        x: player.facing === 1 ? player.x + 35 : player.x - 10,
        y: player.y + 20,
        width: 10,
        height: 4,
        dir: player.facing
    });
}

let shootCooldown = 0;

function collision(a,b){
    return(
    a.x < b.x+b.width &&
    a.x+a.width > b.x &&
    a.y < b.y+b.height &&
    a.y+a.height > b.y
    );
}

function update(){

    if(keys["ArrowLeft"]){
        player.x -= player.speed;
        player.facing = -1;
    }

    if(keys["ArrowRight"]){
        player.x += player.speed;
        player.facing = 1;
    }

    if(keys["ArrowUp"] && !player.jumping){
        player.velocityY = -15;
        player.jumping = true;
    }

    if(keys[" "] && shootCooldown <= 0){
        shoot();
        shootCooldown = 20;
    }

    if(shootCooldown > 0){
        shootCooldown--;
    }

    player.velocityY += gravity;
    player.y += player.velocityY;

    // Pit fall check (Game Over if player falls below screen)
    if(player.y > canvas.height + 100) {
        lives--;
        document.getElementById("lives").textContent = lives;
        if(lives <= 0){
            gameOver("👽 GAME OVER");
        } else {
            player.x = 100;
            player.y = 350;
            player.velocityY = 0;
        }
    }

    let onGround = false;

    platforms.forEach(platform=>{

        if(
            player.x + player.width > platform.x &&
            player.x < platform.x + platform.width &&
            player.y + player.height >= platform.y &&
            player.y + player.height <= platform.y + 25 &&
            player.velocityY >= 0
        ){
            player.y = platform.y - player.height;
            player.velocityY = 0;
            player.jumping = false;
            onGround = true;
        }
    });

    if(!onGround){
        player.jumping = true;
    }

    bullets.forEach((bullet,index)=>{

        bullet.x += bullet.dir * 10;

        if(bullet.x > cameraX + canvas.width || bullet.x < cameraX){
            bullets.splice(index,1);
        }
    });

    aliens.forEach(alien=>{

        if(!alien.alive) return;

        alien.x += alien.dir * (2 + currentLevel * 0.2); // Speed increases per level

        if(alien.x < alien.minX || alien.x > alien.maxX){
            alien.dir *= -1;
        }

        // Bullet hit alien
        bullets.forEach((bullet,bIndex)=>{

            if(collision(bullet,alien)){

                alien.alive = false;
                bullets.splice(bIndex,1);

                score += 100;
                document.getElementById("score").textContent = score;
            }
        });

        // Stomp alien or take damage
        if(
            alien.alive &&
            collision(player,alien)
        ){

            if(player.velocityY > 0 &&
               player.y + player.height < alien.y + 25){

                alien.alive = false;
                player.velocityY = -10;
                score += 100;
                document.getElementById("score").textContent = score;

            }else{

                lives--;
                document.getElementById("lives").textContent = lives;
                player.x = Math.max(50, player.x - 150);
                player.y = 350;

                if(lives <= 0){
                    gameOver("👽 GAME OVER");
                }
            }
        }
    });

    coins.forEach(coin=>{

        if(!coin.collected){

            if(
                player.x < coin.x+20 &&
                player.x+player.width > coin.x &&
                player.y < coin.y+20 &&
                player.y+player.height > coin.y
            ){
                coin.collected = true;
                score += 50;
                document.getElementById("score").textContent = score;
            }
        }
    });

    // Level progression / Flag reach
    if(collision(player,flag)){
        if(currentLevel < maxLevels) {
            loadLevel(currentLevel + 1);
        } else {
            gameOver("🏆 YOU WIN THE ENTIRE ADVENTURE!");
        }
    }

    // Camera follow player smoothly
    cameraX = player.x - canvas.width / 3;
    if(cameraX < 0) cameraX = 0;
    if(cameraX > levelLength - canvas.width) cameraX = levelLength - canvas.width;
}

function drawAstronaut(){

    ctx.fillStyle="white";

    ctx.beginPath();
    ctx.arc(player.x+20,player.y+15,15,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#4FC3F7";

    ctx.beginPath();
    ctx.arc(player.x+20,player.y+15,10,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#ddd";
    ctx.fillRect(player.x+8,player.y+30,24,20);

    ctx.fillRect(player.x+12,player.y+50,5,10);
    ctx.fillRect(player.x+23,player.y+50,5,10);
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.save();
    ctx.translate(-cameraX, 0);

    platforms.forEach(platform=>{

        ctx.fillStyle="#654321";

        ctx.fillRect(
            platform.x,
            platform.y,
            platform.width,
            platform.height
        );
    });

    coins.forEach(coin=>{

        if(!coin.collected){

            ctx.fillStyle="gold";

            ctx.beginPath();
            ctx.arc(
                coin.x,
                coin.y,
                10,
                0,
                Math.PI*2
            );
            ctx.fill();
        }
    });

    aliens.forEach(alien=>{

        if(alien.alive){

            ctx.fillStyle="lime";

            ctx.beginPath();
            ctx.arc(alien.x+20,alien.y+15,15,0,Math.PI*2);
            ctx.fill();

            ctx.fillRect(alien.x+5,alien.y+25,30,15);
        }
    });

    ctx.fillStyle="red";

    bullets.forEach(bullet=>{

        ctx.fillRect(
            bullet.x,
            bullet.y,
            bullet.width,
            bullet.height
        );
    });

    ctx.fillStyle="black";
    ctx.fillRect(flag.x,flag.y,5,flag.height);

    ctx.fillStyle="red";
    ctx.fillRect(flag.x,flag.y,30,20);

    drawAstronaut();

    ctx.restore();
}

function gameOver(text){

    gameRunning = false;

    document.getElementById("resultText").innerHTML = text;

    document.getElementById("finalScore").innerHTML =
        "Final Score: " + score;

    document.getElementById("gameOver").style.display = "block";
}

function gameLoop(){

    if(!gameRunning) return;

    update();
    draw();

    requestAnimationFrame(gameLoop);
}

// Initialize Level 1
loadLevel(1);
gameLoop();

</script>

</body>
</html>
