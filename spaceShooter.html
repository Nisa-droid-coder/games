<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Shooter</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial, sans-serif;
}

canvas{
    display:block;
    margin:auto;
    background:linear-gradient(to bottom,#000015,#000);
}

#hud{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:24px;
    font-weight:bold;
}

#gameOver{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:white;
    display:none;
    background: rgba(20,20,20,0.95);
    padding: 30px;
    border-radius:15px;
    border: 2px solid #00ffff;
    box-shadow: 0 0 20px #00ffff,
                0 0 40px rgba(0,255,255,0.5);
}

button{
    padding:12px 20px;
    font-size:18px;
    cursor:pointer;
    border:none;
    border-radius:8px;
}
</style>
</head>
<body>

<div id="hud">
    Score: <span id="score">0</span>
    &nbsp; | &nbsp;
    Lives: <span id="lives">3</span>
</div>

<div id="gameOver">
    <h1>💥 GAME OVER 💥</h1>
    <h2 id="finalScore"></h2>
    <button onclick="location.reload()">Restart</button>
    <br>
    <br>
    <button onclick="window.location.href='index.html'">Back</button>
</div>

<canvas id="gameCanvas" width="900" height="600"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let score = 0;
let lives = 3;
let gameRunning = true;

const player = {
    x: canvas.width/2 - 25,
    y: canvas.height - 80,
    width: 50,
    height: 50,
    speed: 7
};

const bullets = [];
const rocks = [];
const stars = [];
const keys = {};

let shootCooldown = 0;

// Stars
for(let i=0;i<120;i++){
    stars.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        size:Math.random()*3
    });
}

document.addEventListener("keydown",(e)=>{
    keys[e.key] = true;
});

document.addEventListener("keyup",(e)=>{
    keys[e.key] = false;
});

function createRock(){
    rocks.push({
        x:Math.random()*(canvas.width-50),
        y:-60,
        width:50,
        height:50,
        speed:2 + Math.random()*4
    });
}

setInterval(()=>{
    if(gameRunning){
        createRock();
    }
},700);

function drawStars(){
    ctx.fillStyle="white";

    stars.forEach(star=>{
        ctx.fillRect(star.x,star.y,star.size,star.size);

        star.y += 1;

        if(star.y > canvas.height){
            star.y = 0;
            star.x = Math.random()*canvas.width;
        }
    });
}

function drawPlayer(){

    ctx.fillStyle="#00ffff";

    ctx.beginPath();
    ctx.moveTo(player.x + player.width/2, player.y);
    ctx.lineTo(player.x, player.y + player.height);
    ctx.lineTo(player.x + player.width, player.y + player.height);
    ctx.closePath();
    ctx.fill();

    // cockpit
    ctx.fillStyle="#ffffff";
    ctx.beginPath();
    ctx.arc(player.x + 25, player.y + 20, 6, 0, Math.PI*2);
    ctx.fill();
}

function shoot(){
    bullets.push({
        x:player.x + player.width/2 - 3,
        y:player.y,
        width:6,
        height:15
    });
}

function update(){

    if(keys["ArrowLeft"] && player.x > 0){
        player.x -= player.speed;
    }

    if(keys["ArrowRight"] &&
       player.x < canvas.width-player.width){
        player.x += player.speed;
    }

    // Hold Space to shoot repeatedly
    if(keys[" "] || keys["Spacebar"]){
        if(shootCooldown <= 0){
            shoot();
            shootCooldown = 12;
        }
    }

    if(shootCooldown > 0){
        shootCooldown--;
    }

    // Bullets
    for(let i=bullets.length-1;i>=0;i--){

        bullets[i].y -= 10;

        if(bullets[i].y < 0){
            bullets.splice(i,1);
        }
    }

    // Rocks
    for(let i=rocks.length-1;i>=0;i--){

        const rock = rocks[i];
        rock.y += rock.speed;

        if(rock.y > canvas.height){
            rocks.splice(i,1);
            continue;
        }

        // Ship collision
        if(
            player.x < rock.x + rock.width &&
            player.x + player.width > rock.x &&
            player.y < rock.y + rock.height &&
            player.y + player.height > rock.y
        ){

            rocks.splice(i,1);

            lives--;

            document.getElementById("lives").textContent = lives;

            if(lives <= 0){
                endGame();
            }
            continue;
        }

        // Bullet collision
        for(let j=bullets.length-1;j>=0;j--){

            const bullet = bullets[j];

            if(
                bullet.x < rock.x + rock.width &&
                bullet.x + bullet.width > rock.x &&
                bullet.y < rock.y + rock.height &&
                bullet.y + bullet.height > rock.y
            ){

                bullets.splice(j,1);
                rocks.splice(i,1);

                score += 10;

                document.getElementById("score").textContent = score;
                break;
            }
        }
    }
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawStars();

    drawPlayer();

    // Bullets
    ctx.fillStyle="yellow";
    bullets.forEach(b=>{
        ctx.fillRect(
            b.x,
            b.y,
            b.width,
            b.height
        );
    });

    // Rocks
    rocks.forEach(rock=>{

        ctx.fillStyle="#8b8b8b";

        ctx.beginPath();
        ctx.arc(
            rock.x + rock.width/2,
            rock.y + rock.height/2,
            rock.width/2,
            0,
            Math.PI*2
        );
        ctx.fill();
    });
}

function gameLoop(){

    if(!gameRunning){
        return;
    }

    update();
    draw();

    requestAnimationFrame(gameLoop);
}

function endGame(){

    gameRunning = false;

    document.getElementById("finalScore").innerHTML =
        "Final Score: " + score;

    document.getElementById("gameOver").style.display =
        "block";
}

gameLoop();
</script>

</body>
</html>
