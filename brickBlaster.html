<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Blaster</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    margin:auto;
    background:#000;
}

#hud{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:24px;
    font-weight:bold;
}

#gameOver{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:white;
    display:none;

    background:#1c1c1c;
    padding:30px;
    border-radius:15px;
    border:2px solid #00ffff;

    box-shadow:
    0 0 20px #00ffff,
    0 0 40px rgba(0,255,255,0.5);
}

button{
    padding:12px 20px;
    margin:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}
</style>
</head>
<body>

<div id="hud">
    Score: <span id="score">0</span>
    |
    Lives: <span id="lives">3</span>
    |
    Level: <span id="level">1</span>/10
</div>

<div id="gameOver">
    <h1 id="resultText">Game Over</h1>
    <h2 id="finalScore"></h2>

    <button onclick="location.reload()">Restart</button>
    <br>
    <br>
    <button onclick="window.location.href='index.html'">Back</button>
</div>

<canvas id="gameCanvas" width="900" height="600"></canvas>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let score = 0;
let lives = 3;
let currentLevel = 1;
let maxLevels = 10;
let gameRunning = true;

const paddle = {
    width:130,
    height:15,
    x:385,
    y:560,
    speed:8,
    baseWidth:130
};

const ball = {
    x:450,
    y:300,
    radius:10,
    dx:5,
    dy:-5,
    baseSpeed:5
};

const keys = {};

document.addEventListener("keydown",(e)=>{
    keys[e.key]=true;
});

document.addEventListener("keyup",(e)=>{
    keys[e.key]=false;
});

const brickWidth = 80;
const brickHeight = 25;
const brickPadding = 8;

let bricks = [];
let powerUps = [];

// Active effects tracking (10 seconds duration)
let activeEffects = {
    widePaddle: { active: false, timer: null },
    narrowPaddle: { active: false, timer: null },
    fastBall: { active: false, timer: null },
    slowBall: { active: false, timer: null }
};

function initBricks(){
    bricks = [];
    const rows = 6;
    const cols = 10;
    
    // Different layout patterns based on currentLevel
    for(let r=0; r<rows; r++){
        for(let c=0; c<cols; c++){
            let visible = true;
            let type = "normal";
            let hp = 1;

            if(currentLevel === 2) {
                // Checkerboard pattern
                if((r + c) % 2 === 1) visible = false;
            } else if(currentLevel === 3) {
                // Diamond/Pyramid shape hollowed sides
                if(c < r || c >= cols - r) visible = false;
            } else if(currentLevel === 4) {
                // Columns layout
                if(c % 2 !== 0) visible = false;
            } else if(currentLevel === 5) {
                // Tough bricks mixed in the center
                if(r === 2 && c >= 3 && c <= 6) { type = "tough"; hp = 2; }
            } else if(currentLevel === 6) {
                // Hollow center frame
                if(r > 0 && r < 5 && c > 1 && c < 8) visible = false;
            } else if(currentLevel === 7) {
                // Indestructible pillars & tough bricks
                if((c === 2 || c === 7) && r >= 2) { type = "indestructible"; }
                else if(r === 1) { type = "tough"; hp = 2; }
            } else if(currentLevel === 8) {
                // Zigzag pattern
                if(r % 2 === 0 && c % 2 === 1) visible = false;
                if(r % 2 === 1 && c % 2 === 0) visible = false;
            } else if(currentLevel === 9) {
                // Cross structure
                if(r !== 2 && c !== 4 && c !== 5) visible = false;
            } else if(currentLevel === 10) {
                // Complex multi-tier layout with indestructible shields
                if(r === 0 && (c === 0 || c === 9)) { type = "indestructible"; }
                else if(r === 2 && c % 2 === 0) { type = "tough"; hp = 2; }
                else if(r === 4 && (c < 3 || c > 6)) visible = false;
            }

            if(visible) {
                bricks.push({
                    x: c*(brickWidth+brickPadding)+25,
                    y: r*(brickHeight+brickPadding)+50,
                    width: brickWidth,
                    height: brickHeight,
                    visible: true,
                    type: type,
                    hp: hp
                });
            }
        }
    }
}

initBricks();

function drawPaddle(){
    ctx.fillStyle="#00ffff";
    ctx.fillRect(
        paddle.x,
        paddle.y,
        paddle.width,
        paddle.height
    );
}

function drawBall(){
    ctx.beginPath();
    ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI*2
    );
    ctx.fillStyle="white";
    ctx.fill();
    ctx.closePath();
}

function drawBricks(){
    bricks.forEach(brick=>{
        if(brick.visible){
            if(brick.type === "indestructible") {
                ctx.fillStyle = "#555555";
            } else if(brick.type === "tough") {
                ctx.fillStyle = brick.hp === 2 ? "#ffaa00" : "#ff5500";
            } else {
                ctx.fillStyle = `hsl(${brick.y*1.2},80%,55%)`;
            }

            ctx.fillRect(
                brick.x,
                brick.y,
                brick.width,
                brick.height
            );
        }
    });
}

function drawHeart(x, y, size) {
    ctx.beginPath();
    let topCurveHeight = size * 0.3;
    ctx.moveTo(x, y + topCurveHeight);
    // Left curve
    ctx.bezierCurveTo(
        x, y, 
        x - size / 2, y, 
        x - size / 2, y + topCurveHeight
    );
    // Bottom-left to point
    ctx.bezierCurveTo(
        x - size / 2, y + (size + topCurveHeight) / 2, 
        x, y + size * 0.8, 
        x, y + size
    );
    // Bottom-right to point
    ctx.bezierCurveTo(
        x, y + size * 0.8, 
        x + size / 2, y + (size + topCurveHeight) / 2, 
        x + size / 2, y + topCurveHeight
    );
    // Right curve
    ctx.bezierCurveTo(
        x + size / 2, y, 
        x, y, 
        x, y + topCurveHeight
    );
    ctx.closePath();
    ctx.fill();
}

function drawPowerUps(){
    powerUps.forEach(p => {
        if(p.effect === "life") {
            ctx.fillStyle = "#ff3366";
            drawHeart(p.x, p.y - 4, 20);
        } else {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
            ctx.fillStyle = p.type === "buff" ? "#00ff00" : "#ff0000";
            ctx.fill();
            ctx.closePath();

            ctx.fillStyle = "white";
            ctx.font = "10px Arial";
            ctx.textAlign = "center";
            ctx.fillText(p.label, p.x, p.y + 4);
        }
    });
}

function spawnPowerUp(x, y){
    const rand = Math.random();
    if(rand < 0.35) { // 35% chance to drop power-up / power-down / life
        const types = [
            { type: "buff", effect: "wide", label: "W" },
            { type: "buff", effect: "slow", label: "S" },
            { type: "debuff", effect: "narrow", label: "N" },
            { type: "debuff", effect: "fast", label: "F" },
            { type: "buff", effect: "life", label: "♥" }
        ];
        const chosen = types[Math.floor(Math.random() * types.length)];
        powerUps.push({
            x: x + brickWidth/2,
            y: y,
            radius: 12,
            dy: 3,
            type: chosen.type,
            effect: chosen.effect,
            label: chosen.label
        });
    }
}

function applyPowerUp(effect){
    const duration = 10000; // Exactly 10 seconds

    if(effect === "life") {
        lives++;
        document.getElementById("lives").textContent = lives;
        return;
    }

    if(effect === "wide" || effect === "narrow") {
        if(activeEffects.widePaddle.timer) clearTimeout(activeEffects.widePaddle.timer);
        if(activeEffects.narrowPaddle.timer) clearTimeout(activeEffects.narrowPaddle.timer);
        activeEffects.widePaddle.active = false;
        activeEffects.narrowPaddle.active = false;

        if(effect === "wide") {
            paddle.width = paddle.baseWidth * 1.5;
            activeEffects.widePaddle.active = true;
            activeEffects.widePaddle.timer = setTimeout(() => {
                paddle.width = paddle.baseWidth;
                activeEffects.widePaddle.active = false;
            }, duration);
        } else {
            paddle.width = paddle.baseWidth * 0.7;
            activeEffects.narrowPaddle.active = true;
            activeEffects.narrowPaddle.timer = setTimeout(() => {
                paddle.width = paddle.baseWidth;
                activeEffects.narrowPaddle.active = false;
            }, duration);
        }
    } else if(effect === "fast" || effect === "slow") {
        if(activeEffects.fastBall.timer) clearTimeout(activeEffects.fastBall.timer);
        if(activeEffects.slowBall.timer) clearTimeout(activeEffects.slowBall.timer);
        activeEffects.fastBall.active = false;
        activeEffects.slowBall.active = false;

        let angle = Math.atan2(ball.dy, ball.dx);
        let targetSpeed = ball.baseSpeed;

        if(effect === "fast") {
            targetSpeed = ball.baseSpeed * 1.5;
            activeEffects.fastBall.active = true;
            activeEffects.fastBall.timer = setTimeout(() => {
                let curAngle = Math.atan2(ball.dy, ball.dx);
                ball.dx = Math.cos(curAngle) * ball.baseSpeed;
                ball.dy = Math.sin(curAngle) * ball.baseSpeed;
                activeEffects.fastBall.active = false;
            }, duration);
        } else {
            targetSpeed = ball.baseSpeed * 0.7;
            activeEffects.slowBall.active = true;
            activeEffects.slowBall.timer = setTimeout(() => {
                let curAngle = Math.atan2(ball.dy, ball.dx);
                ball.dx = Math.cos(curAngle) * ball.baseSpeed;
                ball.dy = Math.sin(curAngle) * ball.baseSpeed;
                activeEffects.slowBall.active = false;
            }, duration);
        }
        ball.dx = Math.cos(angle) * targetSpeed;
        ball.dy = Math.sin(angle) * targetSpeed;
    }
}

function update(){

    if(keys["ArrowLeft"] && paddle.x > 0){
        paddle.x -= paddle.speed;
    }

    if(keys["ArrowRight"] &&
       paddle.x + paddle.width < canvas.width){
        paddle.x += paddle.speed;
    }

    ball.x += ball.dx;
    ball.y += ball.dy;

    // Update power-ups falling
    powerUps.forEach((p, index) => {
        p.y += p.dy;
        if(
            p.y + p.radius >= paddle.y &&
            p.x >= paddle.x &&
            p.x <= paddle.x + paddle.width
        ) {
            applyPowerUp(p.effect);
            powerUps.splice(index, 1);
        } else if(p.y > canvas.height) {
            powerUps.splice(index, 1);
        }
    });

    // Wall collisions
    if(ball.x + ball.radius > canvas.width ||
       ball.x - ball.radius < 0){
        ball.dx *= -1;
    }

    if(ball.y - ball.radius < 0){
        ball.dy *= -1;
    }

    // Paddle collision
    if(
        ball.y + ball.radius > paddle.y &&
        ball.x > paddle.x &&
        ball.x < paddle.x + paddle.width
    ){

        ball.dy = -Math.abs(ball.dy);

        let hitPos =
        (ball.x - (paddle.x + paddle.width/2))
        /(paddle.width/2);

        let currentSpeedMag = Math.hypot(ball.dx, ball.dy);
        ball.dx = hitPos * 7;
        let factor = currentSpeedMag / Math.hypot(ball.dx, ball.dy);
        ball.dx *= factor;
        ball.dy *= factor;
    }

    // Lose life
    if(ball.y > canvas.height){

        lives--;

        document.getElementById("lives")
        .textContent = lives;

        if(lives <= 0){
            gameOver("💥 GAME OVER 💥");
        }else{
            resetBall();
        }
    }

    // Brick collision
    bricks.forEach(brick=>{

        if(!brick.visible) return;

        if(
            ball.x > brick.x &&
            ball.x < brick.x + brick.width &&
            ball.y - ball.radius < brick.y + brick.height &&
            ball.y + ball.radius > brick.y
        ){
            if(brick.type === "indestructible") {
                ball.dy *= -1;
                return;
            }

            brick.hp--;
            if(brick.hp <= 0) {
                brick.visible = false;
                score += 10 * currentLevel;
                document.getElementById("score").textContent = score;
                spawnPowerUp(brick.x, brick.y);
            }

            ball.dy *= -1;
        }

    });

    // Win/Next Level Check
    let remaining = bricks.filter(b=>b.visible && b.type !== "indestructible").length;

    if(remaining === 0){
        currentLevel++;
        if(currentLevel > maxLevels) {
            gameOver("🏆 YOU WIN THE GAME!");
        } else {
            document.getElementById("level").textContent = currentLevel;
            powerUps = [];
            ball.baseSpeed += 0.3;
            resetBall();
            initBricks();
        }
    }
}

function resetBall(){
    ball.x = canvas.width/2;
    ball.y = canvas.height/2;

    let dir = Math.random() > 0.5 ? 1 : -1;
    ball.dx = ball.baseSpeed * dir;
    ball.dy = -ball.baseSpeed;
}

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawBricks();
    drawPowerUps();
    drawPaddle();
    drawBall();
}

function gameOver(message){

    gameRunning = false;

    document.getElementById("resultText")
    .innerHTML = message;

    document.getElementById("finalScore")
    .innerHTML =
    "Final Score: " + score;

    document.getElementById("gameOver")
    .style.display = "block";
}

function gameLoop(){

    if(!gameRunning) return;

    update();
    draw();

    requestAnimationFrame(gameLoop);
}

gameLoop();

</script>

</body>
</html>
