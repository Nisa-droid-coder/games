<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Battle Arena</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#1a1a1a;
    font-family:Arial,sans-serif;
    touch-action: none;
}

canvas{
    display:block;
    margin:auto;
    background:#2d3436;
    max-width: 100%;
    height: auto;
}

#hud{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:24px;
    font-weight:bold;
    z-index: 10;
}

#gameOver{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    display:none;
    text-align:center;
    color:white;

    background:rgba(0,0,0,.9);
    padding:30px;
    border-radius:20px;

    box-shadow:
    0 0 20px red,
    0 0 50px rgba(255,0,0,.5);
    z-index: 20;
}

button{
    padding:12px 20px;
    margin:10px;
    font-size:18px;
    cursor:pointer;
    border:none;
    border-radius:8px;
}

/* Mobile On-Screen Controls */
#controls {
    position: absolute;
    bottom: 20px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    box-sizing: border-box;
    z-index: 10;
    user-select: none;
    -webkit-user-select: none;
}

.control-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
}

.d-pad-row {
    display: flex;
    gap: 25px;
}

.mob-btn {
    width: 65px;
    height: 65px;
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.4);
    color: white;
    font-size: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    outline: none;
    user-select: none;
    -webkit-user-select: none;
    backdrop-filter: blur(4px);
}

.mob-btn:active {
    background: rgba(0, 255, 255, 0.4);
    border-color: cyan;
}

#action-group {
    display: flex;
    align-items: center;
}

.attack-btn {
    width: 80px;
    height: 80px;
    background: rgba(255, 0, 0, 0.3);
    border: 2px solid rgba(255, 0, 0, 0.6);
    font-size: 16px;
    font-weight: bold;
    border-radius: 50%;
}

.attack-btn:active {
    background: rgba(255, 0, 0, 0.6);
    border-color: white;
}
</style>
</head>
<body>

<div id="hud">
    Score: <span id="score">0</span>
    |
    Lives: <span id="lives">5</span>
    |
    Wave: <span id="wave">1</span>
</div>

<div id="gameOver">
    <h1>⚔️ Battle Ended </h1>
    <h2 id="finalScore"></h2>

    <button onclick="location.reload()">Restart</button>
    <br>
    <br>
    <button onclick="window.location.href='index.html'">Back</button>
</div>

<canvas id="gameCanvas" width="1000" height="650"></canvas>

<!-- On-Screen Mobile Controls Layout -->
<div id="controls">
    <div class="control-group">
        <button class="mob-btn" id="upBtn">&#8593;</button>
        <div class="d-pad-row">
            <button class="mob-btn" id="leftBtn">&#8592;</button>
            <button class="mob-btn" id="rightBtn">&#8594;</button>
        </div>
        <button class="mob-btn" id="downBtn">&#8595;</button>
    </div>
    <div class="control-group" id="action-group">
        <button class="mob-btn attack-btn" id="attackBtn">ATTACK</button>
    </div>
</div>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let score = 0;
let lives = 5;
let wave = 1;
let gameRunning = true;

const keys = {};

document.addEventListener("keydown",(e)=>{
    keys[e.key]=true;

    if(e.code==="Space"){
        attack();
    }
});

document.addEventListener("keyup",(e)=>{
    keys[e.key]=false;
});

// Helper function to bind mobile touch/mouse events to key states or actions
function bindTouchButton(id, keyCode, isAction = false) {
    const btn = document.getElementById(id);
    
    btn.addEventListener("touchstart", (e) => {
        e.preventDefault();
        if (isAction) {
            attack();
        } else {
            keys[keyCode] = true;
        }
    }, {passive: false});

    btn.addEventListener("touchend", (e) => {
        e.preventDefault();
        if (!isAction) {
            keys[keyCode] = false;
        }
    }, {passive: false});

    // Fallback for desktop mouse clicking on mobile buttons if testing
    btn.addEventListener("mousedown", () => {
        if (isAction) {
            attack();
        } else {
            keys[keyCode] = true;
        }
    });
    btn.addEventListener("mouseup", () => {
        if (!isAction) {
            keys[keyCode] = false;
        }
    });
}

bindTouchButton("upBtn", "ArrowUp");
bindTouchButton("downBtn", "ArrowDown");
bindTouchButton("leftBtn", "ArrowLeft");
bindTouchButton("rightBtn", "ArrowRight");
bindTouchButton("attackBtn", null, true);

const player = {
    x:500,
    y:325,
    width:45,
    height:45,
    speed:5
};

const enemies = [];

function spawnWave(){

    for(let i=0;i<wave+2;i++){

        enemies.push({
            x:Math.random()*900,
            y:Math.random()*550,
            width:40,
            height:40,
            alive:true
        });
    }
}

spawnWave();

let attackEffect = false;
let attackTimer = 0;

function attack(){

    attackEffect = true;
    attackTimer = 10;

    enemies.forEach(enemy=>{

        if(!enemy.alive) return;

        const dx = enemy.x - player.x;
        const dy = enemy.y - player.y;

        const distance =
        Math.sqrt(dx*dx + dy*dy);

        if(distance < 90){

            enemy.alive = false;

            score += 100;

            document.getElementById("score")
            .textContent = score;
        }
    });
}

function update(){

    if(keys["ArrowLeft"]){
        player.x -= player.speed;
    }

    if(keys["ArrowRight"]){
        player.x += player.speed;
    }

    if(keys["ArrowUp"]){
        player.y -= player.speed;
    }

    if(keys["ArrowDown"]){
        player.y += player.speed;
    }

    player.x =
        Math.max(
        0,
        Math.min(canvas.width-player.width,
        player.x)
    );

    player.y =
        Math.max(
        0,
        Math.min(canvas.height-player.height,
        player.y)
    );

    let aliveEnemies = 0;

    enemies.forEach(enemy=>{

        if(!enemy.alive) return;

        aliveEnemies++;

        const dx = player.x - enemy.x;
        const dy = player.y - enemy.y;

        const distance =
        Math.sqrt(dx*dx + dy*dy);

        enemy.x += dx / distance * 1.5;
        enemy.y += dy / distance * 1.5;

        if(distance < 35){

            enemy.alive = false;

            lives--;

            document.getElementById("lives")
            .textContent = lives;

            if(lives <= 0){
                gameOver();
            }
        }
    });

    if(aliveEnemies === 0){

        wave++;

        document.getElementById("wave")
        .textContent = wave;

        spawnWave();
    }

    if(attackTimer > 0){
        attackTimer--;
    }else{
        attackEffect = false;
    }
}

function drawPlayer(){

    ctx.fillStyle="#00ffff";

    ctx.beginPath();
    ctx.arc(
        player.x + 22,
        player.y + 22,
        22,
        0,
        Math.PI*2
    );
    ctx.fill();

    if(attackEffect){

        ctx.strokeStyle="yellow";
        ctx.lineWidth=4;

        ctx.beginPath();
        ctx.arc(
            player.x + 22,
            player.y + 22,
            70,
            0,
            Math.PI*2
        );
        ctx.stroke();
    }
}

function drawEnemies(){

    enemies.forEach(enemy=>{

        if(!enemy.alive) return;

        ctx.fillStyle="crimson";

        ctx.beginPath();
        ctx.arc(
            enemy.x + 20,
            enemy.y + 20,
            20,
            0,
            Math.PI*2
        );
        ctx.fill();

        ctx.fillStyle="white";

        ctx.fillRect(enemy.x+10,enemy.y+12,5,5);
        ctx.fillRect(enemy.x+25,enemy.y+12,5,5);
    });
}

function drawArena(){

    for(let x=0;x<canvas.width;x+=50){

        for(let y=0;y<canvas.height;y+=50){

            ctx.strokeStyle =
            "rgba(255,255,255,0.05)";

            ctx.strokeRect(x,y,50,50);
        }
    }
}

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawArena();
    drawPlayer();
    drawEnemies();
}

function gameOver(){

    gameRunning = false;

    document.getElementById("finalScore")
    .innerHTML =
    "Final Score: " + score +
    "<br>Reached Wave: " + wave;

    document.getElementById("gameOver")
    .style.display = "block";
}

function gameLoop(){

    if(!gameRunning) return;

    update();
    draw();

    requestAnimationFrame(gameLoop);
}

gameLoop();

</script>

</body>
</html>
