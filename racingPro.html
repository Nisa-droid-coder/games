<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Racing Pro</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#222;
    font-family:Arial,sans-serif;
    touch-action: none;
}

#hud{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:24px;
    font-weight:bold;
    z-index:10;
}

canvas{
    display:block;
    margin:auto;
    background:#444;
    max-width: 100%;
    height: auto;
}

#gameOver{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:white;
    display:none;

    background:#1c1c1c;
    padding:30px;
    border-radius:20px;
    border:2px solid #00ffff;

    box-shadow:
    0 0 20px cyan,
    0 0 40px rgba(0,255,255,.5);
    z-index: 20;
}

button{
    padding:12px 20px;
    margin:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}

/* Mobile On-Screen Controls */
#controls {
    position: absolute;
    bottom: 20px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 30px;
    box-sizing: border-box;
    z-index: 10;
    user-select: none;
    -webkit-user-select: none;
}

.mob-btn {
    width: 75px;
    height: 75px;
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.4);
    color: white;
    font-size: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    outline: none;
    user-select: none;
    -webkit-user-select: none;
    backdrop-filter: blur(4px);
}

.mob-btn:active {
    background: rgba(0, 255, 255, 0.4);
    border-color: cyan;
}
</style>
</head>
<body>

<div id="hud">
    Score: <span id="score">0</span>
    |
    Lives: <span id="lives">3</span>
</div>

<div id="gameOver">
    <h1>💥 GAME OVER 💥</h1>
    <h2 id="finalScore"></h2>

    <button onclick="location.reload()">Restart</button>
    <br>
    <br>
    <button onclick="window.location.href='index.html'">Back</button>
</div>

<canvas id="gameCanvas" width="500" height="700"></canvas>

<!-- On-Screen Mobile Controls Layout -->
<div id="controls">
    <button class="mob-btn" id="leftBtn">&#8592;</button>
    <button class="mob-btn" id="rightBtn">&#8594;</button>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let score = 0;
let lives = 3;
let gameRunning = true;

const keys = {};

document.addEventListener("keydown", e=>{
    keys[e.key]=true;
});

document.addEventListener("keyup", e=>{
    keys[e.key]=false;
});

// Helper function to bind mobile touch/mouse events to key states
function bindTouchButton(id, keyCode) {
    const btn = document.getElementById(id);
    
    btn.addEventListener("touchstart", (e) => {
        e.preventDefault();
        keys[keyCode] = true;
    }, {passive: false});

    btn.addEventListener("touchend", (e) => {
        e.preventDefault();
        keys[keyCode] = false;
    }, {passive: false});

    // Fallback for desktop mouse clicking on mobile buttons if testing
    btn.addEventListener("mousedown", () => {
        keys[keyCode] = true;
    });
    btn.addEventListener("mouseup", () => {
        keys[keyCode] = false;
    });
}

bindTouchButton("leftBtn", "ArrowLeft");
bindTouchButton("rightBtn", "ArrowRight");

const player = {
    width:60,
    height:100,
    x:220,
    y:570,
    speed:7
};

const enemies = [];

let roadSpeed = 6;
let spawnRate = 1000;

const laneWidth = canvas.width / 4;
const lanes = [
    laneWidth*0 + 32,
    laneWidth*1 + 32,
    laneWidth*2 + 32,
    laneWidth*3 + 32
];

function spawnEnemy(){

    enemies.push({
        x: lanes[Math.floor(Math.random()*4)],
        y:-120,
        width:60,
        height:100,
        color:`hsl(${Math.random()*360},80%,50%)`
    });
}

setInterval(()=>{
    if(gameRunning){
        spawnEnemy();
    }
},spawnRate);

let roadLines = [];

for(let i=0;i<20;i++){
    roadLines.push({
        y:i*40
    });
}

function drawRoad(){

    ctx.fillStyle="#555";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.strokeStyle="white";
    ctx.lineWidth=5;

    ctx.beginPath();
    ctx.moveTo(laneWidth,0);
    ctx.lineTo(laneWidth,canvas.height);

    ctx.moveTo(laneWidth*2,0);
    ctx.lineTo(laneWidth*2,canvas.height);

    ctx.moveTo(laneWidth*3,0);
    ctx.lineTo(laneWidth*3,canvas.height);
    ctx.stroke();

    roadLines.forEach(line=>{

        ctx.fillStyle="yellow";

        ctx.fillRect(
            canvas.width/2-5,
            line.y,
            10,
            25
        );

        line.y += roadSpeed;

        if(line.y > canvas.height){
            line.y = -25;
        }
    });
}

function drawPlayer(){

    ctx.fillStyle="#00ffff";

    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );

    ctx.fillStyle="#fff";

    ctx.fillRect(player.x+10,player.y+15,15,15);
    ctx.fillRect(player.x+35,player.y+15,15,15);
}

function drawEnemies(){

    enemies.forEach(enemy=>{

        ctx.fillStyle=enemy.color;

        ctx.fillRect(
            enemy.x,
            enemy.y,
            enemy.width,
            enemy.height
        );

        enemy.y += roadSpeed;
    });
}

function collision(a,b){

    return(
        a.x < b.x+b.width &&
        a.x+a.width > b.x &&
        a.y < b.y+b.height &&
        a.y+a.height > b.y
    );
}

function update(){

    if(keys["ArrowLeft"] && player.x > 10){
        player.x -= player.speed;
    }

    if(keys["ArrowRight"] &&
       player.x < canvas.width-player.width-10){
        player.x += player.speed;
    }

    for(let i=enemies.length-1;i>=0;i--){

        const enemy = enemies[i];

        if(enemy.y > canvas.height){

            enemies.splice(i,1);

            score += 5;

            document.getElementById("score").textContent =
            score;

            // Difficulty increase
            if(score % 50 === 0){
                roadSpeed += 0.5;
            }

            continue;
        }

        if(collision(player,enemy)){

            enemies.splice(i,1);

            lives--;

            document.getElementById("lives").textContent =
            lives;

            if(lives <= 0){
                endGame();
            }
        }
    }
}

function endGame(){

    gameRunning = false;

    document.getElementById("finalScore").innerHTML =
    "Final Score: " + score;

    document.getElementById("gameOver").style.display =
    "block";
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawRoad();
    drawPlayer();
    drawEnemies();
}

function gameLoop(){

    if(!gameRunning) return;

    update();
    draw();

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
