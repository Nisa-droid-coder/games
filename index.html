<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎮 Game Hub · 2x3</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #0a0f1e;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    /* ----- HOME PAGE (2x3 grid) ----- */
    #homePage {
      width: 100%;
      max-width: 700px;
    }
    .home-title {
      color: #eef5ff;
      font-size: 2.8rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .home-sub {
      color: #8ca3c0;
      text-align: center;
      margin-bottom: 28px;
      font-size: 1.1rem;
    }
    .game-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .game-card {
      background: #1a2639;
      border-radius: 28px;
      padding: 28px 12px 24px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 10px 0 #0e1525, 0 8px 20px rgba(0,0,0,0.6);
      border: 1px solid #334b66;
      transition: all 0.08s ease;
      color: #d6e5ff;
    }
    .game-card:active {
      transform: translateY(6px);
      box-shadow: 0 4px 0 #0e1525;
    }
    .game-card .emoji {
      font-size: 3.6rem;
      display: block;
      margin-bottom: 6px;
    }
    .game-card .name {
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: 0.3px;
    }
    .game-card .desc {
      font-size: 0.75rem;
      color: #8fa8c9;
      margin-top: 4px;
    }
    /* ----- GAME PAGE ----- */
    #gamePage {
      display: none;
      width: 100%;
      max-width: 820px;
    }
    .game-container {
      background: #1a2639;
      border-radius: 56px 56px 40px 40px;
      padding: 24px 24px 32px;
      box-shadow: 0 25px 40px rgba(0,0,0,0.7), 0 0 0 1px #3b4d66 inset;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .back-btn {
      background: #2f4058;
      border: none;
      border-radius: 60px;
      padding: 10px 24px;
      color: #ecf5ff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 5px 0 #141f2b;
      border: 1px solid #4c6380;
      transition: 0.06s linear;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .back-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #141f2b;
    }
    .game-title {
      color: #d6e5ff;
      font-size: 1.5rem;
      font-weight: 600;
    }
    .canvas-wrapper {
      background: #0f172a;
      border-radius: 32px;
      padding: 10px;
      box-shadow: 0 0 0 2px #2d4059, 0 12px 30px rgba(0,0,0,0.7);
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 780 / 460;
      background: #111c2e;
      border-radius: 24px;
      touch-action: none;
      cursor: default;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 20px;
      color: #c7d9f0;
      padding: 0 6px;
    }
    .info-badge {
      background: #1d2b40;
      padding: 8px 22px;
      border-radius: 60px;
      font-weight: 500;
      border-left: 4px solid #facc15;
      font-size: 1rem;
      min-width: 140px;
      text-align: center;
    }
    .reset-btn {
      background: #3f3a5a;
      border: none;
      border-radius: 60px;
      padding: 10px 28px;
      font-weight: 600;
      color: #f0f6ff;
      font-size: 1rem;
      box-shadow: 0 5px 0 #1f1b30;
      cursor: pointer;
      transition: 0.06s linear;
      border: 1px solid #6f6490;
    }
    .reset-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #1f1b30;
    }
    .score-lives {
      display: flex;
      gap: 24px;
      background: #142233;
      padding: 6px 24px;
      border-radius: 60px;
    }
    .score-lives span {
      font-weight: 700;
      background: #263952;
      padding: 2px 16px;
      border-radius: 40px;
      color: #b6d6ff;
    }
    @media (max-width: 500px) {
      .game-grid { gap: 12px; }
      .game-card { padding: 18px 8px; }
      .game-card .emoji { font-size: 2.8rem; }
      .home-title { font-size: 2rem; }
      .status-bar { flex-direction: column; align-items: stretch; }
      .info-badge { min-width: auto; }
    }
  </style>
</head>
<body>

<!-- ========== HOME PAGE (2x3) ========== -->
<div id="homePage">
  <div class="home-title">🎮 Game Hub</div>
  <div class="home-sub">pick your game</div>
  <div class="game-grid" id="gameGrid">
    <div class="game-card" data-game="brick">
      <span class="emoji">🧱</span>
      <div class="name">Brick Breaker</div>
      <div class="desc">break all bricks</div>
    </div>
    <div class="game-card" data-game="snake">
      <span class="emoji">🐍</span>
      <div class="name">Snake</div>
      <div class="desc">eat & grow</div>
    </div>
    <div class="game-card" data-game="pong">
      <span class="emoji">🏓</span>
      <div class="name">Pong</div>
      <div class="desc">vs AI</div>
    </div>
    <div class="game-card" data-game="flappy">
      <span class="emoji">🐤</span>
      <div class="name">Flappy Bird</div>
      <div class="desc">fly through pipes</div>
    </div>
    <div class="game-card" data-game="memory">
      <span class="emoji">🧠</span>
      <div class="name">Memory</div>
      <div class="desc">find pairs</div>
    </div>
    <div class="game-card" data-game="tictac">
      <span class="emoji">❌⭕</span>
      <div class="name">Tic-Tac-Toe</div>
      <div class="desc">3 in a row</div>
    </div>
  </div>
</div>

<!-- ========== GAME PAGE ========== -->
<div id="gamePage">
  <div class="game-container">
    <div class="top-bar">
      <button class="back-btn" id="backBtn">← Back</button>
      <span class="game-title" id="gameTitle">🧱 Brick</span>
      <div style="width:80px;"></div>
    </div>
    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="780" height="460"></canvas>
    </div>
    <div class="status-bar">
      <div class="score-lives">
        <div>🏆 <span id="scoreDisplay">0</span></div>
        <div>❤️ <span id="livesDisplay">3</span></div>
      </div>
      <div class="info-badge" id="statusMessage">▶ ready</div>
      <button class="reset-btn" id="resetButton">↺ reset</button>
    </div>
  </div>
</div>

<script>
  (function() {
    // ----- DOM refs -----
    const homePage = document.getElementById('homePage');
    const gamePage = document.getElementById('gamePage');
    const gameTitle = document.getElementById('gameTitle');
    const backBtn = document.getElementById('backBtn');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreSpan = document.getElementById('scoreDisplay');
    const livesSpan = document.getElementById('livesDisplay');
    const statusMsg = document.getElementById('statusMessage');
    const resetBtn = document.getElementById('resetButton');

    const W = 780, H = 460;
    let currentGame = 'brick';
    let gameActive = false;
    let gameOver = false;
    let score = 0;
    let lives = 3;
    let frameId = null;

    // ----- BRICK state -----
    let bricks = [];
    let ball = { x: 390, y: 340, dx: 0, dy: 0, r: 8 };
    let paddle = { x: 340, y: 425, w: 100, h: 16 };
    let pointerX = 390;

    // ----- SNAKE state -----
    let snake = [];
    let food = { x: 200, y: 200 };
    let dir = { dx: 1, dy: 0 };
    let nextDir = { dx: 1, dy: 0 };
    let snakeTimer = 0;
    const SNAKE_SIZE = 18;

    // ----- PONG state -----
    let pong = {
      ball: { x: 390, y: 230, dx: 3.5, dy: 2.8, r: 8 },
      leftPaddle: { y: 190, h: 70, w: 12, score: 0 },
      rightPaddle: { y: 190, h: 70, w: 12, score: 0 },
      aiSpeed: 3.2
    };
    let pointerY = 230;

    // ----- FLAPPY state -----
    let flappy = {
      bird: { x: 180, y: 200, vy: 0, r: 14 },
      pipes: [],
      gravity: 0.25,
      jump: -5.2,
      pipeTimer: 0,
      pipeGap: 130,
      pipeWidth: 40,
      score: 0
    };

    // ----- MEMORY state -----
    let memory = {
      cards: [],
      selected: [],
      matched: 0,
      totalPairs: 6,
      flipped: [],
      lock: false
    };
    const EMOJIS = ['🍎','🍌','🍇','🍉','🍓','🍒','🍑','🥝','🍍','🥥','🧁','🍩'];

    // ----- TIC TAC state -----
    let tic = {
      board: Array(9).fill(null),
      turn: 'X',
      winner: null,
      winLine: null
    };

    // ----- reset functions -----
    function resetCurrentGame() {
      switch(currentGame) {
        case 'brick': resetBrick(); break;
        case 'snake': resetSnake(); break;
        case 'pong': resetPong(); break;
        case 'flappy': resetFlappy(); break;
        case 'memory': resetMemory(); break;
        case 'tictac': resetTicTac(); break;
        default: break;
      }
      updateUI();
    }

    // ----- BRICK -----
    function resetBrick() {
      const colors = ['#f87171','#fbbf24','#34d399','#60a5fa','#a78bfa','#f472b6'];
      bricks = [];
      for (let r=0; r<6; r++) {
        for (let c=0; c<10; c++) {
          bricks.push({
            x: c*(64+6)+6+10, y: r*(22+6)+50,
            w:64, h:22, alive:true, color: colors[r%colors.length]
          });
        }
      }
      ball = { x:390, y:340, dx:0, dy:0, r:8 };
      paddle = { x:340, y:425, w:100, h:16 };
      score = 0; lives = 3; gameActive = false; gameOver = false;
      statusMsg.innerText = '⬆️ launch';
    }
    function launchBrick() {
      if (gameActive || gameOver) return;
      if (lives <= 0) { resetBrick(); return; }
      const angle = (Math.random()*1.2-0.6)*1.1;
      const speed = 4.8;
      ball.dx = Math.cos(angle+Math.PI/2)*speed;
      ball.dy = Math.sin(angle+Math.PI/2)*speed;
      if (Math.abs(ball.dx)<1.2) ball.dx = ball.dx>0?1.8:-1.8;
      gameActive = true; gameOver = false;
      statusMsg.innerText = '⚡ playing';
    }
    function updateBrick() {
      if (!gameActive || gameOver) return;
      ball.x += ball.dx; ball.y += ball.dy;
      if (ball.x-ball.r<0 || ball.x+ball.r>W) ball.dx = -ball.dx;
      if (ball.y-ball.r<0) ball.dy = -ball.dy;
      if (ball.y+ball.r>H) {
        lives--; updateUI();
        if (lives<=0) { gameActive=false; gameOver=true; statusMsg.innerText='💔 game over'; resetBallPaddle(); return; }
        gameActive=false; resetBallPaddle(); statusMsg.innerText='⬆️ launch'; return;
      }
      if (ball.dy>0 && ball.y+ball.r>=paddle.y && ball.y+ball.r<=paddle.y+12) {
        if (ball.x>=paddle.x-ball.r && ball.x<=paddle.x+paddle.w+ball.r) {
          let hit = (ball.x-paddle.x)/paddle.w;
          hit = Math.min(1,Math.max(0,hit));
          const angle = (hit-0.5)*1.8;
          const spd=5.0;
          ball.dx = Math.sin(angle)*spd;
          ball.dy = -Math.cos(angle)*spd;
          if (Math.abs(ball.dx)<1.0) ball.dx = ball.dx>0?1.8:-1.8;
          ball.y = paddle.y-ball.r-1;
        }
      }
      for (let b of bricks) {
        if (!b.alive) continue;
        const cx=ball.x, cy=ball.y, r=ball.r;
        const nearX = Math.max(b.x, Math.min(cx, b.x+b.w));
        const nearY = Math.max(b.y, Math.min(cy, b.y+b.h));
        const dist = Math.hypot(cx-nearX, cy-nearY);
        if (dist<r) {
          b.alive=false; score+=10; updateUI();
          const ox = r-Math.abs(cx-nearX), oy = r-Math.abs(cy-nearY);
          if (ox<oy) ball.dx = -ball.dx;
          else ball.dy = -ball.dy;
          if (Math.abs(cx-nearX)>Math.abs(cy-nearY)) ball.x += (cx>nearX?1:-1)*1.5;
          else ball.y += (cy>nearY?1:-1)*1.5;
          break;
        }
      }
      if (bricks.every(b=>!b.alive)) { gameActive=false; gameOver=true; statusMsg.innerText='🎉 you win!'; resetBallPaddle(); }
    }
    function resetBallPaddle() {
      paddle.x = (W-paddle.w)/2;
      ball.x = paddle.x+paddle.w/2;
      ball.y = paddle.y-ball.r-2;
      ball.dx=0; ball.dy=0;
    }

    // ----- SNAKE -----
    function resetSnake() {
      snake = [{x:200,y:200},{x:182,y:200},{x:164,y:200}];
      dir = {dx:1,dy:0}; nextDir = {dx:1,dy:0};
      food = {x: 300, y: 200};
      score = 0; lives = 1; gameActive = true; gameOver = false;
      snakeTimer = 0;
      statusMsg.innerText = '🐍 use arrows';
      placeFoodSnake();
    }
    function placeFoodSnake() {
      let free = false;
      for (let i=0; i<1000; i++) {
        const fx = Math.floor(Math.random()*(W/SNAKE_SIZE))*SNAKE_SIZE;
        const fy = Math.floor(Math.random()*(H/SNAKE_SIZE))*SNAKE_SIZE;
        if (!snake.some(s=>s.x===fx && s.y===fy)) { food={x:fx,y:fy}; free=true; break; }
      }
      if (!free) { gameActive=false; gameOver=true; statusMsg.innerText='🏆 you win!'; }
    }
    function updateSnake() {
      if (!gameActive || gameOver) return;
      snakeTimer++;
      if (snakeTimer<8) return;
      snakeTimer=0;
      dir = {...nextDir};
      const head = {x: snake[0].x + dir.dx*SNAKE_SIZE, y: snake[0].y + dir.dy*SNAKE_SIZE};
      if (head.x<0 || head.x>=W || head.y<0 || head.y>=H) { gameActive=false; gameOver=true; statusMsg.innerText='💥 game over'; return; }
      if (snake.some(s=>s.x===head.x && s.y===head.y)) { gameActive=false; gameOver=true; statusMsg.innerText='💥 game over'; return; }
      snake.unshift(head);
      if (head.x===food.x && head.y===food.y) { score+=10; updateUI(); placeFoodSnake(); }
      else snake.pop();
    }

    // ----- PONG -----
    function resetPong() {
      pong.ball = { x:390, y:230, dx:3.5, dy:2.8, r:8 };
      pong.leftPaddle = { y:190, h:70, w:12, score:0 };
      pong.rightPaddle = { y:190, h:70, w:12, score:0 };
      score = 0; lives = 3; gameActive = true; gameOver = false;
      statusMsg.innerText = '🏓 AI vs you';
    }
    function updatePong() {
      if (!gameActive || gameOver) return;
      const b = pong.ball;
      b.x += b.dx; b.y += b.dy;
      if (b.y-b.r<0 || b.y+b.r>H) b.dy = -b.dy;
      const lp = pong.leftPaddle;
      const target = b.y - lp.h/2;
      if (lp.y + lp.h/2 < target - 8) lp.y += pong.aiSpeed;
      else if (lp.y + lp.h/2 > target + 8) lp.y -= pong.aiSpeed;
      lp.y = Math.max(0, Math.min(H-lp.h, lp.y));
      const rp = pong.rightPaddle;
      rp.y = Math.max(0, Math.min(H-rp.h, pointerY - rp.h/2));
      if (b.dx<0 && b.x-b.r <= lp.w && b.x-b.r >= lp.w-4) {
        if (b.y >= lp.y && b.y <= lp.y+lp.h) { b.dx = -b.dx; b.x = lp.w + b.r; }
      }
      if (b.dx>0 && b.x+b.r >= W-rp.w && b.x+b.r <= W-rp.w+4) {
        if (b.y >= rp.y && b.y <= rp.y+rp.h) { b.dx = -b.dx; b.x = W - rp.w - b.r; }
      }
      if (b.x < -20) { pong.rightPaddle.score++; lives--; updateUI(); if(lives<=0){gameActive=false;gameOver=true;statusMsg.innerText='💔 lose';} else resetPongBall(); }
      if (b.x > W+20) { pong.leftPaddle.score++; score+=5; updateUI(); resetPongBall(); }
    }
    function resetPongBall() {
      pong.ball.x = 390; pong.ball.y = 230;
      pong.ball.dx = (Math.random()>0.5?3.5:-3.5);
      pong.ball.dy = (Math.random()*2.4+1.2)*(Math.random()>0.5?1:-1);
    }

    // ----- FLAPPY -----
    function resetFlappy() {
      flappy.bird = { x:180, y:200, vy:0, r:14 };
      flappy.pipes = [];
      flappy.pipeTimer = 0;
      flappy.score = 0;
      score = 0; lives = 3; gameActive = true; gameOver = false;
      statusMsg.innerText = '🐤 click to flap';
    }
    function updateFlappy() {
      if (!gameActive || gameOver) return;
      const b = flappy.bird;
      b.vy += flappy.gravity;
      b.y += b.vy;
      if (b.y+b.r>H || b.y-b.r<0) { gameActive=false; gameOver=true; statusMsg.innerText='💥 crash'; return; }
      flappy.pipeTimer++;
      if (flappy.pipeTimer>70) {
        flappy.pipeTimer=0;
        const gapY = Math.random()*(H-200)+80;
        flappy.pipes.push({ x:W, gapY:gapY, scored:false });
      }
      for (let i=flappy.pipes.length-1; i>=0; i--) {
        const p = flappy.pipes[i];
        p.x -= 3;
        if (p.x + flappy.pipeWidth < 0) { flappy.pipes.splice(i,1); continue; }
        if (b.x+b.r > p.x && b.x-b.r < p.x+flappy.pipeWidth) {
          if (b.y-b.r < p.gapY || b.y+b.r > p.gapY+flappy.pipeGap) {
            gameActive=false; gameOver=true; statusMsg.innerText='💥 crash'; return;
          }
        }
        if (!p.scored && p.x + flappy.pipeWidth < b.x) {
          p.scored=true; flappy.score++; score+=10; updateUI();
        }
      }
    }

    // ----- MEMORY -----
    function resetMemory() {
      const pairs = 6;
      const selectedEmojis = EMOJIS.slice(0, pairs);
      let deck = [...selectedEmojis, ...selectedEmojis];
      for (let i=deck.length-1; i>0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      memory.cards = deck.map((emoji, idx) => ({ id:idx, emoji, flipped:false, matched:false }));
      memory.selected = [];
      memory.matched = 0;
      memory.totalPairs = pairs;
      memory.flipped = [];
      memory.lock = false;
      score = 0; lives = 3; gameActive = true; gameOver = false;
      statusMsg.innerText = '🧠 find pairs';
    }
    function flipMemory(index) {
      if (memory.lock || !gameActive || gameOver) return;
      const card = memory.cards[index];
      if (card.flipped || card.matched) return;
      card.flipped = true;
      memory.selected.push(index);
      if (memory.selected.length === 2) {
        memory.lock = true;
        const [i1, i2] = memory.selected;
        if (memory.cards[i1].emoji === memory.cards[i2].emoji) {
          memory.cards[i1].matched = true;
          memory.cards[i2].matched = true;
          memory.matched++;
          score += 20; updateUI();
          memory.selected = [];
          memory.lock = false;
          if (memory.matched === memory.totalPairs) {
            gameActive=false; gameOver=true; statusMsg.innerText='🎉 you win!';
          }
        } else {
          setTimeout(() => {
            memory.cards[i1].flipped = false;
            memory.cards[i2].flipped = false;
            memory.selected = [];
            memory.lock = false;
          }, 500);
        }
      }
    }

    // ----- TIC TAC -----
    function resetTicTac() {
      tic.board = Array(9).fill(null);
      tic.turn = 'X';
      tic.winner = null;
      tic.winLine = null;
      score = 0; lives = 3; gameActive = true; gameOver = false;
      statusMsg.innerText = '❌⭕ X turn';
    }
    function ticMove(index) {
      if (!gameActive || gameOver) return;
      if (tic.winner || tic.board[index]) return;
      tic.board[index] = tic.turn;
      const win = checkTicWin();
      if (win) {
        tic.winner = tic.turn;
        tic.winLine = win;
        gameActive=false; gameOver=true;
        statusMsg.innerText = `🏆 ${tic.turn} wins!`;
        score += 30; updateUI();
        return;
      }
      if (tic.board.every(c=>c!==null)) {
        gameActive=false; gameOver=true;
        statusMsg.innerText = '🤝 draw';
        return;
      }
      tic.turn = tic.turn === 'X' ? 'O' : 'X';
      statusMsg.innerText = `❌⭕ ${tic.turn} turn`;
    }
    function checkTicWin() {
      const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      for (let l of lines) {
        const [a,b,c]=l;
        if (tic.board[a] && tic.board[a]===tic.board[b] && tic.board[a]===tic.board[c]) return l;
      }
      return null;
    }

    // ----- DRAW functions -----
    function drawBrick() {
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,W,H);
      for (let b of bricks) if (b.alive) {
        ctx.shadowColor='rgba(255,255,200,0.2)'; ctx.shadowBlur=8;
        ctx.fillStyle=b.color; ctx.beginPath(); roundRect(ctx,b.x,b.y,b.w,b.h,6); ctx.fill();
        ctx.shadowBlur=0; ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=1.2; ctx.stroke();
      }
      ctx.shadowBlur=18; ctx.shadowColor='#b0d0ff';
      ctx.fillStyle='#c8dfff'; ctx.beginPath(); roundRect(ctx,paddle.x,paddle.y,paddle.w,paddle.h,12); ctx.fill();
      ctx.shadowBlur=28; ctx.shadowColor='#facc15';
      ctx.fillStyle='#fde047'; ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
    }
    function drawSnake() {
      ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,W,H);
      for (let s of snake) { ctx.fillStyle='#4ade80'; ctx.shadowBlur=16; ctx.shadowColor='#86efac'; ctx.beginPath(); roundRect(ctx,s.x+1,s.y+1,SNAKE_SIZE-2,SNAKE_SIZE-2,6); ctx.fill(); }
      ctx.shadowBlur=20; ctx.fillStyle='#f87171'; ctx.beginPath(); ctx.arc(food.x+SNAKE_SIZE/2, food.y+SNAKE_SIZE/2, SNAKE_SIZE/2-2,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
    }
    function drawPong() {
      ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,W,H);
      ctx.strokeStyle='#2d4a6a'; ctx.lineWidth=2; ctx.setLineDash([10,15]); ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke(); ctx.setLineDash([]);
      const lp=pong.leftPaddle, rp=pong.rightPaddle;
      ctx.fillStyle='#93c5fd'; ctx.shadowBlur=20; ctx.shadowColor='#60a5fa';
      ctx.fillRect(0,lp.y,lp.w,lp.h); ctx.fillRect(W-rp.w,rp.y,rp.w,rp.h);
      ctx.shadowColor='#facc15'; ctx.fillStyle='#fde047'; ctx.beginPath(); ctx.arc(pong.ball.x,pong.ball.y,pong.ball.r,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
    }
    function drawFlappy() {
      ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,W,H);
      for (let p of flappy.pipes) {
        ctx.fillStyle='#34d399'; ctx.shadowBlur=10; ctx.shadowColor='#6ee7b7';
        ctx.fillRect(p.x,0,flappy.pipeWidth,p.gapY);
        ctx.fillRect(p.x,p.gapY+flappy.pipeGap,flappy.pipeWidth,H-p.gapY-flappy.pipeGap);
      }
      ctx.shadowBlur=30; ctx.shadowColor='#fbbf24';
      ctx.fillStyle='#fde047'; ctx.beginPath(); ctx.arc(flappy.bird.x,flappy.bird.y,flappy.bird.r,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
    }
    function drawMemory() {
      ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,W,H);
      const cols=4, rows=3, cw=120, ch=100, gap=16, startX=(W-(cols*(cw+gap)-gap))/2, startY=(H-(rows*(ch+gap)-gap))/2;
      for (let i=0; i<memory.cards.length; i++) {
        const c = memory.cards[i];
        const row=Math.floor(i/cols), col=i%cols;
        const x=startX+col*(cw+gap), y=startY+row*(ch+gap);
        ctx.shadowBlur=12; ctx.shadowColor='#2d4059';
        if (c.flipped || c.matched) {
          ctx.fillStyle=c.matched?'#1b3a2a':'#2d4a6a';
          ctx.beginPath(); roundRect(ctx,x,y,cw,ch,14); ctx.fill();
          ctx.fillStyle='#f0f9ff'; ctx.font='38px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText(c.emoji, x+cw/2, y+ch/2);
        } else {
          ctx.fillStyle='#3b5d8c';
          ctx.beginPath(); roundRect(ctx,x,y,cw,ch,14); ctx.fill();
          ctx.fillStyle='#a0c4ff'; ctx.font='28px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText('?', x+cw/2, y+ch/2+2);
        }
        ctx.shadowBlur=0;
      }
    }
    function drawTicTac() {
      ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,W,H);
      const size=120, startX=(W-3*size)/2, startY=(H-3*size)/2;
      ctx.strokeStyle='#6b8db5'; ctx.lineWidth=4;
      for (let i=1; i<3; i++) { ctx.beginPath(); ctx.moveTo(startX+i*size,startY); ctx.lineTo(startX+i*size,startY+3*size); ctx.stroke(); ctx.beginPath(); ctx.moveTo(startX,startY+i*size); ctx.lineTo(startX+3*size,startY+i*size); ctx.stroke(); }
      for (let i=0; i<9; i++) {
        const row=Math.floor(i/3), col=i%3;
        const x=startX+col*size, y=startY+row*size;
        ctx.font='52px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillStyle=tic.board[i]==='X'?'#fbbf24':'#60a5fa';
        ctx.fillText(tic.board[i]||'', x+size/2, y+size/2+4);
      }
      if (tic.winLine) {
        ctx.strokeStyle='#facc15'; ctx.lineWidth=6; ctx.shadowBlur=20; ctx.shadowColor='#facc15';
        const [a,b,c]=tic.winLine;
        const pos = i=>{ const r=Math.floor(i/3), col=i%3; return {x:startX+col*size+size/2, y:startY+r*size+size/2}; };
        const p1=pos(a), p2=pos(c);
        ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
        ctx.shadowBlur=0;
      }
    }
    function roundRect(ctx,x,y,w,h,r) { if(r>w/2) r=w/2; if(r>h/2) r=h/2; ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); return ctx; }

    function draw() {
      switch(currentGame) {
        case 'brick': drawBrick(); break;
        case 'snake': drawSnake(); break;
        case 'pong': drawPong(); break;
        case 'flappy': drawFlappy(); break;
        case 'memory': drawMemory(); break;
        case 'tictac': drawTicTac(); break;
      }
    }

    function updateUI() {
      scoreSpan.innerText = score;
      livesSpan.innerText = lives;
    }

    // ----- GAME LOOP -----
    function gameLoop() {
      switch(currentGame) {
        case 'brick': updateBrick(); break;
        case 'snake': updateSnake(); break;
        case 'pong': updatePong(); break;
        case 'flappy': updateFlappy(); break;
        default: break;
      }
      draw();
      requestAnimationFrame(gameLoop);
    }

    // ----- EVENTS (canvas) -----
    function handleCanvasClick(e) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
      let cx = (e.clientX - rect.left)*scaleX, cy = (e.clientY - rect.top)*scaleY;
      if (currentGame === 'brick') {
        if (!gameActive && !gameOver && lives>0) launchBrick();
        else if (gameOver) { resetCurrentGame(); setTimeout(()=>launchBrick(),20); }
      } else if (currentGame === 'flappy') {
        if (!gameActive && !gameOver) resetFlappy();
        if (gameActive && !gameOver) flappy.bird.vy = flappy.jump;
      } else if (currentGame === 'memory') {
        const cols=4, rows=3, cw=120, ch=100, gap=16, startX=(W-(cols*(cw+gap)-gap))/2, startY=(H-(rows*(ch+gap)-gap))/2;
        for (let i=0; i<memory.cards.length; i++) {
          const row=Math.floor(i/cols), col=i%cols;
          const x=startX+col*(cw+gap), y=startY+row*(ch+gap);
          if (cx>=x && cx<=x+cw && cy>=y && cy<=y+ch) { flipMemory(i); break; }
        }
      } else if (currentGame === 'tictac') {
        const size=120, startX=(W-3*size)/2, startY=(H-3*size)/2;
        for (let i=0; i<9; i++) {
          const row=Math.floor(i/3), col=i%3;
          const x=startX+col*size, y=startY+row*size;
          if (cx>=x && cx<=x+size && cy>=y && cy<=y+size) { ticMove(i); break; }
        }
      }
    }
    function handleMouseMove(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
      let cx = (e.clientX - rect.left)*scaleX, cy = (e.clientY - rect.top)*scaleY;
      pointerY = cy;
      if (currentGame === 'brick') {
        paddle.x = Math.min(W-paddle.w/2, Math.max(paddle.w/2, cx)) - paddle.w/2;
        if (!gameActive && !gameOver && lives>0) {
          ball.x = paddle.x+paddle.w/2;
          ball.y = paddle.y-ball.r-2;
        }
      } else if (currentGame === 'pong') {
        const rp = pong.rightPaddle;
        rp.y = Math.max(0, Math.min(H-rp.h, cy - rp.h/2));
      }
    }
    function handleKey(e) {
      if (currentGame === 'snake') {
        const key = e.key;
        if (key === 'ArrowUp' && dir.dy!==1) nextDir={dx:0,dy:-1};
        else if (key === 'ArrowDown' && dir.dy!==-1) nextDir={dx:0,dy:1};
        else if (key === 'ArrowLeft' && dir.dx!==1) nextDir={dx:-1,dy:0};
        else if (key === 'ArrowRight' && dir.dx!==-1) nextDir={dx:1,dy:0};
        e.preventDefault();
      }
    }

    // ----- NAVIGATION: home ↔ game -----
    function showGame(gameId) {
      currentGame = gameId;
      homePage.style.display = 'none';
      gamePage.style.display = 'block';
      const names = {
        brick: '🧱 Brick Breaker',
        snake: '🐍 Snake',
        pong: '🏓 Pong',
        flappy: '🐤 Flappy Bird',
        memory: '🧠 Memory',
        tictac: '❌⭕ Tic-Tac-Toe'
      };
      gameTitle.innerText = names[gameId] || 'Game';
      resetCurrentGame();
      if (currentGame === 'memory') statusMsg.innerText = '🧠 tap cards';
      else if (currentGame === 'tictac') statusMsg.innerText = '❌⭕ X turn';
      else if (currentGame === 'snake') statusMsg.innerText = '🐍 arrow keys';
      else if (currentGame === 'pong') statusMsg.innerText = '🏓 move mouse';
      else if (currentGame === 'flappy') statusMsg.innerText = '🐤 click to flap';
      else if (currentGame === 'brick') statusMsg.innerText = '⬆️ launch';
      updateUI();
    }
    function goHome() {
      homePage.style.display = 'block';
      gamePage.style.display = 'none';
      if (frameId) cancelAnimationFrame(frameId);
    }

    // ----- INIT -----
    function init() {
      document.querySelectorAll('.game-card').forEach(card => {
        card.addEventListener('click', () => {
          const game = card.dataset.game;
          showGame(game);
        });
      });
      backBtn.addEventListener('click', goHome);
      resetBtn.addEventListener('click', resetCurrentGame);
      canvas.addEventListener('click', handleCanvasClick);
      canvas.addEventListener('mousemove', handleMouseMove);
      document.addEventListener('keydown', handleKey);
      function loop() {
        gameLoop();
        frameId = requestAnimationFrame(loop);
      }
      loop();
      homePage.style.display = 'block';
      gamePage.style.display = 'none';
      resetBrick();
    }
    init();
  })();
</script>
</body>
</html>
