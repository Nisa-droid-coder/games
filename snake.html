<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake Game</title>

<style>
body{
    margin:0;
    background:#111;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    flex-direction:column;
    color:white;
    touch-action: none;
    overflow: hidden;
}

#hud{
    margin-bottom:15px;
    font-size:24px;
    font-weight:bold;
}

canvas{
    background:#222;
    border:4px solid #00ff88;
    border-radius:10px;
    max-width: 95vw;
    height: auto;
}

#gameOver{
    display:none;
    position:absolute;
    background:rgba(0,0,0,0.95);
    padding:30px;
    border-radius:20px;
    text-align:center;
    border:2px solid #00ff88;
    box-shadow:0 0 20px #00ff88;
    z-index: 20;
}

button{
    padding:12px 20px;
    margin:10px;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

/* Mobile On-Screen D-Pad Controls */
#controls {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    user-select: none;
    -webkit-user-select: none;
}

.control-row {
    display: flex;
    gap: 8px;
}

.ctrl-btn {
    width: 65px;
    height: 65px;
    background: rgba(0, 255, 136, 0.15);
    border: 2px solid #00ff88;
    color: #00ff88;
    font-size: 24px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    outline: none;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
}

.ctrl-btn:active {
    background: rgba(0, 255, 136, 0.5);
    color: white;
}
</style>
</head>
<body>

<div id="hud">
    Score: <span id="score">0</span>
</div>

<canvas id="gameCanvas" width="600" height="600"></canvas>

<!-- On-Screen Mobile Controls Layout -->
<div id="controls">
    <button class="ctrl-btn" id="upBtn">&#8593;</button>
    <div class="control-row">
        <button class="ctrl-btn" id="leftBtn">&#8592;</button>
        <button class="ctrl-btn" id="downBtn">&#8595;</button>
        <button class="ctrl-btn" id="rightBtn">&#8594;</button>
    </div>
</div>

<div id="gameOver">
    <h1>🐍 Game Over</h1>
    <h2 id="finalScore"></h2>

    <button onclick="location.reload()">Restart</button>
    <br>
    <button onclick="window.location.href='index.html'">Back</button>
</div>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const gridSize = 20;
const tileCount = canvas.width / gridSize;

let score = 0;

let snake = [
    {x:10, y:10}
];

let dx = 1;
let dy = 0;

let food = {
    x:15,
    y:15
};

let gameSpeed = 120;
let gameRunning = true;

document.addEventListener("keydown", changeDirection);

function setDirection(newDx, newDy){
    if(newDx === 0 && newDy === -1 && dy !== 1){
        dx = 0; dy = -1;
    }
    else if(newDx === 0 && newDy === 1 && dy !== -1){
        dx = 0; dy = 1;
    }
    else if(newDx === -1 && newDy === 0 && dx !== 1){
        dx = -1; dy = 0;
    }
    else if(newDx === 1 && newDy === 0 && dx !== -1){
        dx = 1; dy = 0;
    }
}

function changeDirection(e){
    if(e.key === "ArrowUp") setDirection(0, -1);
    else if(e.key === "ArrowDown") setDirection(0, 1);
    else if(e.key === "ArrowLeft") setDirection(-1, 0);
    else if(e.key === "ArrowRight") setDirection(1, 0);
}

// Bind Touch Events for Mobile Buttons
function bindTouchButton(id, newDx, newDy) {
    const btn = document.getElementById(id);
    btn.addEventListener("touchstart", (e) => {
        e.preventDefault();
        setDirection(newDx, newDy);
    }, {passive: false});
    
    // Mouse fallback for testing on desktop
    btn.addEventListener("mousedown", () => {
        setDirection(newDx, newDy);
    });
}

bindTouchButton("upBtn", 0, -1);
bindTouchButton("downBtn", 0, 1);
bindTouchButton("leftBtn", -1, 0);
bindTouchButton("rightBtn", 1, 0);

function randomFood(){

    food.x = Math.floor(Math.random() * tileCount);
    food.y = Math.floor(Math.random() * tileCount);
}

function drawFood(){

    ctx.fillStyle = "red";

    ctx.beginPath();
    ctx.arc(
        food.x * gridSize + 10,
        food.y * gridSize + 10,
        8,
        0,
        Math.PI * 2
    );

    ctx.fill();
}

function drawSnake(){

    snake.forEach((segment,index)=>{

        ctx.fillStyle =
        index === 0 ? "#00ff88" : "#00cc66";

        ctx.fillRect(
            segment.x * gridSize,
            segment.y * gridSize,
            gridSize - 2,
            gridSize - 2
        );
    });
}

function update(){

    const head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };

    // Wall collision
    if(
        head.x < 0 ||
        head.x >= tileCount ||
        head.y < 0 ||
        head.y >= tileCount
    ){
        endGame();
        return;
    }

    // Self collision
    for(let i=0;i<snake.length;i++){

        if(
            head.x === snake[i].x &&
            head.y === snake[i].y
        ){
            endGame();
            return;
        }
    }

    snake.unshift(head);

    // Eat food
    if(
        head.x === food.x &&
        head.y === food.y
    ){

        score += 10;

        document.getElementById("score").textContent =
        score;

        randomFood();

        // Increase speed slightly
        if(gameSpeed > 50){
            gameSpeed -= 3;
        }

    }else{
        snake.pop();
    }
}

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawFood();
    drawSnake();
}

function gameLoop(){

    if(!gameRunning) return;

    update();
    draw();

    setTimeout(gameLoop, gameSpeed);
}

function endGame(){

    gameRunning = false;

    document.getElementById("finalScore").innerHTML =
    "Final Score: " + score;

    document.getElementById("gameOver").style.display =
    "block";
}

randomFood();
gameLoop();

</script>

</body>
</html>
